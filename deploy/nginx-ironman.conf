# IronMan / איש הברזל — Next.js on 127.0.0.1:3012
# Cloudflare orange cloud terminates TLS; origin is HTTP.

upstream ironman_web {
    server 127.0.0.1:3012;
    keepalive 32;
}

map $http_upgrade $ironman_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ironman.mela-media.co.il ironman.co.il www.ironman.co.il;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /_next/static/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ironman_connection_upgrade;
        proxy_read_timeout 75s;
    }
}
