# IronMan / איש הברזל — Next.js on 127.0.0.1:3012
#
# Cloudflare may use Flexible (origin :80) or Full (origin :443).
# Both listeners are required so HTTPS visitors are not caught by another
# vhost's default SSL server (NestJS APIs return JSON 404 for GET /).

upstream ironman_web {
    server 127.0.0.1:3012;
    keepalive 32;
}

map $http_upgrade $ironman_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name theironman.co.il www.theironman.co.il ironman.mela-media.co.il ironman.co.il www.ironman.co.il;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /_next/static/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ironman_connection_upgrade;
        proxy_read_timeout 75s;
    }
}

# Origin TLS for Cloudflare SSL mode "Full" (self-signed is OK; Strict needs a real cert).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theironman.co.il www.theironman.co.il ironman.mela-media.co.il ironman.co.il www.ironman.co.il;

    ssl_certificate     /etc/nginx/ssl/ironman.pem;
    ssl_certificate_key /etc/nginx/ssl/ironman.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    location /_next/static/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ironman_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ironman_connection_upgrade;
        proxy_read_timeout 75s;
    }
}
